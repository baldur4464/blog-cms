# Production profile — all secrets via environment variables
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:db}:5432/${DB_NAME:blogcms}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: false

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
    cookie:
      secure: true
      same-site: Strict

  bootstrap:
    admin:
      password: ${BOOTSTRAP_ADMIN_PASSWORD}

  storage:
    location: ${STORAGE_LOCATION:/app/storage}
