spring:
  application:
    name: blog-cms

  datasource:
    url: jdbc:postgresql://localhost:5432/blogcms
    username: ${DB_USERNAME:blogcms}
    password: ${DB_PASSWORD:blogcms}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

server:
  port: 8080

app:
  security:
    jwt:
      secret: ${JWT_SECRET:changeme-this-is-a-dev-only-secret-key-min-256-bits!!}
      access-token-ttl: 15m
      refresh-token-ttl: 14d
    cookie:
      secure: true
      same-site: Strict

  storage:
    backend: ${STORAGE_BACKEND:local}
    location: ${STORAGE_LOCATION:./storage}
    max-file-size: 10MB
    allowed-types:
      - image/jpeg
      - image/png
      - image/webp
      - image/gif
      - application/pdf

  bootstrap:
    enabled: ${BOOTSTRAP_ENABLED:true}
    admin:
      username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
      email: ${BOOTSTRAP_ADMIN_EMAIL:admin@example.com}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:changeme}

  i18n:
    default-locale: de
    supported-locales:
      - de
      - en

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
